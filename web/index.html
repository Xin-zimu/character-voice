<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUKI.N&gt;</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0d1015; --panel:#141820; --line:#222a36;
    --text:#c6d0dc; --dim:#6b7889; --accent:#7fb2c4;
    --user:#1b222c;
    --serif:"Songti SC","Noto Serif CJK SC",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Cascadia Mono",monospace;
    --rail:#7fb2c4;
    --glow:0 0 14px rgba(127,178,196,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    display:flex; justify-content:center; overflow:hidden;
    -webkit-font-smoothing:antialiased;
    transition:background .8s ease,color .8s ease;
  }
  /* 极淡的扫描线。不晃眼，只是让屏幕"有厚度" */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:60;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.014) 0 1px,transparent 1px 3px);
    opacity:.7; mix-blend-mode:screen;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:59;
    background:radial-gradient(ellipse at 50% 0%,rgba(127,178,196,.055),transparent 62%);
    transition:background .8s;
  }

  .app{width:100%;max-width:880px;height:100%;display:flex;flex-direction:column;padding:0 30px}

  /* ---------------- 顶栏 ---------------- */
  header{
    padding:22px 0 0; border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:0; transition:border-color .8s;
  }
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
  .brand{display:flex;flex-direction:column;gap:6px}
  .brand .name{
    font-family:var(--mono); font-size:13px; letter-spacing:.22em; color:var(--text);
    display:flex; align-items:center; gap:9px;
  }
  .brand .name .dot{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:var(--glow); animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  .brand .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.1em}
  .brand .sub b{color:var(--accent);font-weight:500}

  .controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .btn{
    background:transparent;border:1px solid var(--line);color:var(--dim);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    padding:6px 11px;border-radius:2px;cursor:pointer;transition:all .22s;white-space:nowrap;
  }
  .btn:hover{color:var(--text);border-color:var(--dim)}
  .btn.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  .icon-btn{width:30px;height:29px;padding:0;font-size:13px}

  /* ---------------- 世界条 ---------------- */
  .worldbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 0 14px; gap:14px;
  }
  .tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .tabs button{
    background:transparent;border:none;border-right:1px solid var(--line);
    color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    padding:8px 15px;cursor:pointer;transition:all .22s;display:flex;gap:8px;align-items:center;
  }
  .tabs button:last-child{border-right:none}
  .tabs button:hover{color:var(--text)}
  .tabs button.on{background:var(--accent);color:var(--bg)}
  .tabs button .en{font-size:9px;opacity:.7;letter-spacing:.12em}
  .tabs button.on .en{opacity:.85}
  .wdesc{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.04em;text-align:right;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------------- 主区 ---------------- */
  main{
    flex:1;overflow-y:auto;padding:26px 0 18px;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  main::-webkit-scrollbar{width:5px}
  main::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

  .msg{margin-bottom:24px;animation:rise .4s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 终端行：YUKI.N> 前缀 + 正文 */
  .msg.yuki{display:flex;gap:14px}
  .msg.yuki .rail{width:1px;background:var(--rail);opacity:.4;flex:none;border-radius:1px;transition:background .8s}
  .msg.yuki .body{flex:1;min-width:0}
  .line{display:flex;align-items:baseline;gap:0;font-family:var(--mono);font-size:14.5px;line-height:1.95}
  .line .pre{color:var(--accent);flex:none;letter-spacing:.02em;margin-right:.55em}
  .line .txt{
    color:var(--text);white-space:pre-wrap;word-break:break-word;letter-spacing:.04em;
    text-shadow:0 0 20px rgba(127,178,196,.13);
  }
  .line .caret{color:var(--accent);animation:blink 1.05s steps(2) infinite;margin-left:1px;font-size:12px}
  /* 字符画（CHAT-017）：必须 pre，不然空白被折叠，图案塌成一团。
     word-break 在 pre 下也不该动，宁可出横向滚动条——折行会把图案劈成两半。
     字体与正文同一套等宽，不另配：「能不能显示」比「好不好看」重要，
     另配一套字体等于在赌用户机器上有它。 */
  .line .txt.art{
    white-space:pre; overflow-x:auto; word-break:normal; letter-spacing:0;
    line-height:1.35;
  }
  /* 窄屏：缩放而不是折行。transform 不影响布局，也不改字符宽度比例，
     所以图案的比例不会变形——这是「缩」和「折」的关键区别。 */
  .line .txt.art.shrink{transform-origin:left top}
  /* 多块排版：一个 .txt 里既有文字块又有图案块。折行与保空白是逐块的，
     不能挂在父节点上——父节点一保空白，文字行就跟着被压成一行。 */
  .line .txt.multi{white-space:normal}
  /* 文字块用 pre-wrap 而不是 normal（2026-10-26 实测）：normal 会把块内的换行
     压掉，于是「文字 \n\n 图案」中间那个空行消失，图案紧贴上一句。
     pre-wrap 既保留块内换行与空行，又照常折行——「文字被压成一行」那个旧 bug
     是整条用 pre（不折行）造成的，不是 pre-wrap。 */
  .line .txt .blk{display:block;margin:0;white-space:pre-wrap}
  .line .txt .blk.art{
    white-space:pre; overflow-x:auto; word-break:normal; letter-spacing:0;
    line-height:1.35;
  }
  @keyframes blink{50%{opacity:0}}

  .meta{
    margin-top:7px;font-family:var(--mono);font-size:10px;color:var(--dim);
    letter-spacing:.05em;display:flex;gap:11px;align-items:center;flex-wrap:wrap;opacity:.8;
  }
  .meta .warn{color:#c47a5a}
  .meta .tagx{color:var(--dim);opacity:.75}
  .meta button{
    background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:10px;
    cursor:pointer;letter-spacing:.05em;padding:0;border-bottom:1px dashed var(--line);
  }
  .meta button:hover{color:var(--accent);border-color:var(--accent)}

  /* 用户行 */
  .msg.user{display:flex;justify-content:flex-end}
  .msg.user .text{
    background:var(--user);padding:10px 15px;font-family:var(--mono);font-size:13px;
    line-height:1.75;max-width:80%;border-radius:2px;white-space:pre-wrap;word-break:break-word;
    color:var(--text);border-left:2px solid var(--line);transition:background .8s;
  }

  /* 系统消息：世界切换 */
  .sys{
    margin:26px 0;font-family:var(--mono);font-size:10.5px;color:var(--dim);
    letter-spacing:.08em;display:flex;flex-direction:column;gap:5px;
    border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
    padding:11px 0;animation:rise .5s ease;
  }
  .sys .ok{color:var(--accent)}
  .sys .warnline{color:#c47a5a}

  /* 空状态 */
  .empty{height:100%;display:flex;flex-direction:column;justify-content:center;gap:10px;padding-bottom:70px}
  .empty .l{font-family:var(--mono);font-size:12.5px;color:var(--dim);line-height:2.1;letter-spacing:.05em}
  .empty .l .pre{color:var(--accent);opacity:.85}
  .empty .hint{font-family:var(--mono);font-size:10px;color:var(--line);letter-spacing:.1em;margin-top:14px}
  .empty .hint.link{color:var(--accent);opacity:.7;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .empty .hint.link:hover{opacity:1}

  /* ---------------- 输入 ---------------- */
  footer{padding:12px 0 20px;border-top:1px solid var(--line);transition:border-color .8s}
  .input-row{display:flex;gap:9px;align-items:flex-end}
  .prefix{
    font-family:var(--mono);font-size:12px;color:var(--accent);opacity:.8;
    padding-bottom:13px;flex:none;letter-spacing:.02em;
  }
  textarea{
    flex:1; min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-family:var(--mono);font-size:13px;line-height:1.7;padding:10px 13px;border-radius:2px;overflow-y:auto;resize:none;outline:none;max-height:150px;min-height:42px;
    transition:border-color .25s,background .8s;
  }
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(127,178,196,.05)}
  textarea::placeholder{color:var(--dim);opacity:.6}
  #send{
    background:var(--accent);color:var(--bg);border:none;padding:0 18px;height:42px;
    border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    transition:opacity .2s;flex:none;
  }
  #send:hover{opacity:.85}
  #send:disabled{opacity:.3;cursor:not-allowed}
  .footnote{
    margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--line);
    letter-spacing:.05em;display:flex;justify-content:space-between;gap:10px;
  }
  .footnote .r{cursor:pointer;display:flex;gap:10px}
  .footnote .r span:hover{color:var(--dim)}

  /* ---------------- 浮层 ---------------- */
  .mask{
    position:fixed;inset:0;background:rgba(5,7,10,.72);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;
  }
  .mask.hidden{display:none}
  .sheet{
    background:var(--panel);border:1px solid var(--line);border-radius:3px;
    width:min(560px,94vw);max-height:86vh;display:flex;flex-direction:column;
  }
  .sheet .head{
    padding:16px 20px 13px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .sheet .head h2{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.16em;color:var(--text)}
  .sheet .head .x{
    background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;line-height:1;padding:2px 4px;
  }
  .sheet .head .x:hover{color:var(--text)}
  .sheet .bodyx{padding:17px 20px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .sheet .bodyx::-webkit-scrollbar{width:5px}
  .sheet .bodyx::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .sheet .foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

  .note{font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.9;margin-bottom:15px;letter-spacing:.02em}
  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .presets button{
    background:var(--bg);border:1px solid var(--line);color:var(--dim);font-family:var(--mono);
    font-size:10.5px;padding:5px 10px;border-radius:2px;cursor:pointer;transition:all .2s;
  }
  .presets button:hover{color:var(--accent);border-color:var(--accent)}
  .field{margin-bottom:12px}
  .field label{display:block;font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.12em;margin-bottom:5px}
  .field input{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    padding:8px 10px;font-size:12px;border-radius:2px;outline:none;font-family:var(--mono);
  }
  .field input:focus{border-color:var(--accent)}

  /* 资料终端 */
  .corpus-list{display:flex;flex-direction:column;gap:1px}
  .corpus-list .ep{
    display:flex;justify-content:space-between;gap:12px;padding:7px 9px;cursor:pointer;
    font-family:var(--mono);font-size:11.5px;color:var(--text);border-radius:2px;transition:background .15s;
  }
  .corpus-list .ep:hover{background:var(--bg)}
  .corpus-list .ep .n{color:var(--dim);font-size:10px}
  .corpus-list .ep .t{color:var(--dim);font-size:10px;white-space:nowrap}
  .corpus-list .ep.crash .n{color:#b98a6a}

  .cx-head{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
  .cx-head .back{font-family:var(--mono);font-size:10.5px;color:var(--dim);cursor:pointer;border-bottom:1px dashed var(--line)}
  .cx-head .back:hover{color:var(--accent)}
  .cx-head .ttl{font-family:var(--mono);font-size:11.5px;color:var(--text);letter-spacing:.06em}
  .cx-head .rg{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
  .cx-line{
    display:flex;gap:11px;padding:4px 6px;border-radius:2px;font-family:var(--mono);font-size:11.5px;
    line-height:1.7;border-left:2px solid transparent;
  }
  .cx-line .ts{color:var(--dim);flex:none;font-size:10px;padding-top:2px;letter-spacing:.02em}
  .cx-line .tx{color:var(--text);white-space:pre-wrap;word-break:break-word}
  .cx-line.anchor{background:rgba(127,178,196,.05);border-left-color:var(--accent)}
  .cx-line.anchor .tx{color:#dbe6f0}
  .cx-line.crash .ts{color:#a97a5c}
  .cx-more{
    margin-top:12px;font-family:var(--mono);font-size:10.5px;color:var(--accent);cursor:pointer;
    text-align:center;padding:8px;border:1px dashed var(--line);border-radius:2px;
  }
  .cx-more:hover{border-color:var(--accent)}

  /* 共同经历 */
  .mem-add{display:flex;gap:6px;margin-bottom:12px}
  .mem-add input{
    flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text);
    padding:7px 9px;font-size:12px;border-radius:2px;outline:none;
  }
  .mem-add input:focus{border-color:var(--accent)}
  .mem-add button{
    background:var(--bg);border:1px solid var(--line);color:var(--dim);font-family:var(--mono);
    font-size:10.5px;padding:0 12px;border-radius:2px;cursor:pointer;
  }
  .mem-add button:hover{color:var(--accent);border-color:var(--accent)}
  .mem-rec{padding:8px 0;border-bottom:1px solid var(--line)}
  .mem-rec .tx{font-size:12.5px;line-height:1.75;color:var(--text);word-break:break-word}
  .mem-rec.retired .tx{color:var(--dim);text-decoration:line-through}
  .mem-rec .mt{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:5px;letter-spacing:.04em}
  .mem-rec .mt .tag{color:#b98a6a}
  .mem-rec .ops{margin-left:auto;display:flex;gap:9px}
  .mem-rec .ops span{cursor:pointer;color:var(--dim)}
  .mem-rec .ops span:hover{color:var(--accent)}
  .mem-rec .row2{display:flex;align-items:center;gap:8px}
  .mem-log{margin-top:15px;border-top:1px solid var(--line);padding-top:11px}
  .mem-log .t{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.12em;margin-bottom:7px}
  .mem-log .ev{font-family:var(--mono);font-size:10px;line-height:1.8;color:var(--dim)}

  /* 调试面板 */
  .dbg-msg{margin-bottom:13px}
  .dbg-msg .who{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.12em;margin-bottom:4px}
  .dbg-msg .bod{font-size:12px;line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-word}
  .dbg-stats{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--mono);font-size:10.5px;color:var(--dim);
    padding:9px 0 12px;border-bottom:1px solid var(--line);margin-bottom:13px}
  .dbg-stats b{color:var(--text);font-weight:400}
  .dbg-sec{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.12em;margin:15px 0 7px}
  .dbg-wing{color:#c47a5a}

  /* 校对面板 */
  pre.prompt{
    font-family:var(--mono);font-size:10.5px;line-height:1.75;color:var(--text);
    white-space:pre-wrap;word-break:break-word;letter-spacing:.01em;
  }
  pre.prompt .h{color:var(--accent)}
  .hits{margin-top:15px;border-top:1px solid var(--line);padding-top:13px}
  .hits .t{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.12em;margin-bottom:8px}
  .hit{font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--dim);margin-bottom:7px;padding-left:9px;border-left:1px solid var(--line)}
  .hit b{color:var(--accent);font-weight:400}
  .hit .cr{color:#b98a6a}

  @media (max-width:600px){
    .app{padding:0 15px}
    .line{font-size:13.5px}
    .wdesc{display:none}
    header{padding-top:16px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="brand">
        <div class="name"><span class="dot"></span><span id="p-name">YUKI.N&gt;</span></div>
        <div class="sub" id="p-sub">信息统合思念体 · 人形终端界面</div>
      </div>
      <div class="controls">
        <button class="btn icon-btn" id="open-corpus" title="资料终端：翻原作原文">▤</button>
        <button class="btn icon-btn" id="open-memory" title="共同经历：她记得你的事">◈</button>
        <button class="btn icon-btn" id="open-preflight" title="调试：上一轮实际发送 + 下一次预览">◇</button>
        <button class="btn icon-btn" id="open-settings" title="接口设置">⚙</button>
        <button class="btn icon-btn" id="clear" title="断开这次连接">×</button>
      </div>
    </div>
    <div class="worldbar">
      <div class="tabs" id="tabs"></div>
      <div class="wdesc" id="wdesc"></div>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <div class="input-row">
      <span class="prefix">YOU&gt;</span>
      <textarea id="input" rows="1" placeholder="……"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="footnote">
      <span>Enter 发送 · Shift+Enter 换行</span>
      <span class="r">
        <!-- 底栏不放统计（CHAT-006）：这里只留「她用什么模型」。
             字数、违例、命中片段都在 ◇ 面板里。 -->
        <span id="model-tag">未配置模型</span>
      </span>
    </div>
  </footer>
</div>

<!-- 设置 -->
<div class="mask hidden" id="settings">
  <div class="sheet">
    <div class="head"><h2>接口设置</h2><button class="x" data-close="settings">×</button></div>
    <div class="bodyx">
      <p class="note">
        填你自己的 API Key。它只保存在这台电脑的浏览器里，不会上传，也不会写进这个目录。<br>
        任何 OpenAI 兼容接口都可以。
      </p>
      <div class="field">
        <label>后端</label>
        <select id="s-backend" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-family:inherit;font-size:13px">
          <option value="">自定义接口（下面的 BASE URL / KEY）</option>
        </select>
        <div class="note" id="s-backend-note" style="margin-top:6px"></div>
      </div>
      <div id="s-custom">
        <div class="presets" id="presets">
          <button data-b="https://api.deepseek.com/v1" data-m="deepseek-chat">DeepSeek</button>
          <button data-b="https://dashscope.aliyuncs.com/compatible-mode/v1" data-m="qwen-plus">阿里百炼</button>
          <button data-b="https://api.siliconflow.cn/v1" data-m="Qwen/Qwen2.5-72B-Instruct">硅基流动</button>
          <button data-b="http://localhost:11434/v1" data-m="qwen2.5:7b">本地 Ollama</button>
        </div>
        <div class="field"><label>BASE URL</label><input id="s-base" placeholder="https://api.deepseek.com/v1"></div>
        <div class="field"><label>API KEY</label><input id="s-key" type="password" placeholder="sk-..."></div>
      </div>
      <div class="field"><label>模型</label>
        <!-- 有可选后端时用真正的下拉（能点开选）；自填接口时用文本框输入 -->
        <select id="s-model-select" class="hidden" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-family:inherit;font-size:13px"></select>
        <input id="s-model" placeholder="deepseek-chat">
        <div class="note" id="s-model-note" style="margin-top:6px"></div>
      </div>
      <div class="field"><label>温度（越高越不稳，长门建议 0.7–0.9）</label><input id="s-temp" placeholder="0.85"></div>
    </div>
    <div class="foot">
      <button class="btn" data-close="settings">取消</button>
      <button class="btn on" id="save-settings">保存</button>
    </div>
  </div>
</div>

<!-- 资料终端 -->
<div class="mask hidden" id="corpus">
  <div class="sheet">
    <div class="head">
      <h2 id="cx-title">资料终端</h2>
      <button class="x" data-close="corpus">×</button>
    </div>
    <div class="bodyx" id="cx-body"></div>
  </div>
</div>

<!-- 共同经历 -->
<div class="mask hidden" id="memory">
  <div class="sheet">
    <div class="head">
      <h2 id="mem-title">共同经历</h2>
      <button class="x" data-close="memory">×</button>
    </div>
    <div class="bodyx" id="mem-body"></div>
  </div>
</div>

<!-- 校对 -->
<div class="mask hidden" id="preflight">
  <div class="sheet">
    <div class="head"><h2>DEBUG · 上一轮实际发送 / 下一次预览</h2><button class="x" data-close="preflight">×</button></div>
    <div class="bodyx" id="pf-body"><span class="note">还没有对话记录。</span></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = s => document.querySelector(s);
  const chatEl = $("#chat"), inputEl = $("#input"), sendBtn = $("#send");

  const LS_SET   = "yuki.settings.v2";
  const LS_WORLD = "yuki.world.v2";
  const LS_HIST  = w => `yuki.hist.v2.${w}`;
  const MAX_PERSIST = 200;
  const loadedWorlds = new Set();

  let worlds = null;          // /api/worlds 返回的 worlds
  let corpusMeta = null;      // 语料统计
  let personas = {};          // id -> card
  let backends = [];          // /api/backends 返回的可选后端
  let world = "normal";
  let hist = { normal: [], crash: [] };   // 每条 {role, content, chars, warn}
  let busy = false;
  let settings = { backend:"", base_url:"", api_key:"", model:"", temperature:"0.85" };
  // 最近一次真正发往 /api/chat 的请求与它的结果摘要（CHAT-006-B）。
  // 只留最近一次：面板要回答的是「刚才那条是怎么发的」，不是历史审计。
  // 存的是 payload 副本，**不含 api_key**——调试面板会把内容渲染到页面上，
  // 把 key 放进去等于把它显示出来。
  let lastSent = null;

  /* ================= 持久化 ================= */
  function loadSettings(){
    try{ settings = {...settings, ...JSON.parse(localStorage.getItem(LS_SET) || "{}")}; }catch(e){}
    paintSettings();
  }
  function paintSettings(){
    const b = backends.find(x => x.id === settings.backend);
    $("#model-tag").textContent = settings.model ||
      (b && b.models && b.models.length ? b.models[0] : (b ? b.name : "未配置模型"));
  }
  function saveSettings(){
    try{ localStorage.setItem(LS_SET, JSON.stringify(settings)); }catch(e){}
    paintSettings();
  }
  function loadHist(w){
    if(loadedWorlds.has(w)) return;
    loadedWorlds.add(w);
    try{
      const raw = JSON.parse(localStorage.getItem(LS_HIST(w)) || "[]");
      hist[w] = Array.isArray(raw) ? raw.filter(m => m && typeof m.content === "string" &&
        (m.role === "user" || m.role === "assistant")).slice(-MAX_PERSIST) : [];
    }catch(e){ hist[w] = []; }
  }
  function saveHist(w = world){
    // 单独兜住: 写满配额不能把已经拿到的回复吃掉
    try{
      const slim = hist[w]
        .filter(m => m.role === "user" || m.role === "assistant")
        .slice(-MAX_PERSIST)
        .map(m => ({role:m.role, content:m.content, chars:m.chars, warn:m.warn}));
      localStorage.setItem(LS_HIST(w), JSON.stringify(slim));
    }catch(e){
      systemLine([["warnline", "记录写入失败：本地存储已满。连接内容仍在屏幕上，但刷新后会丢。"]]);
    }
  }

  /* ================= 主题 ================= */
  function applyTheme(){
    const p = currentPersona();
    if(!p) return;
    const t = p.theme || {};
    const r = document.documentElement.style;
    const map = {bg:"--bg", panel:"--panel", line:"--line", text:"--text",
                 dim:"--dim", accent:"--accent", bubble_user:"--user"};
    for(const [k, v] of Object.entries(map)) if(t[k]) r.setProperty(v, t[k]);
    r.setProperty("--rail", t.accent || "#7fb2c4");
    $("#p-name").textContent = (p.protocol && p.protocol.prefix) || "YUKI.N>";
    $("#p-sub").textContent  = p.subtitle || "";
    document.title = (p.protocol && p.protocol.prefix) || "YUKI.N>";
    const wm = worlds && worlds[world];
    $("#wdesc").textContent = wm ? wm.desc : "";
    inputEl.placeholder = world === "crash" ? "那个……你想说什么" : "……";
  }

  function currentPersona(){
    const wm = worlds && worlds[world];
    const id = wm ? wm.persona : "yuki";
    return personas[id] || personas[Object.keys(personas)[0]] || null;
  }

  /* ================= 渲染 ================= */
  const isSys = m => m && m.sys;

  function visible(m){
    return m && (m.role === "user" || m.role === "assistant" || m.sys);
  }

  // 重画时如果调试面板是开着的，让它跟着刷新：面板显示的是「当前世界」的
  // 统计与违例，切世界或清空之后还挂着旧数据会误导。
  function renderAll(){
    chatEl.innerHTML = "";
    // 面板开着就跟着重画。判断用 classList 而不是隐藏状态变量：
    // 面板的显示由 CSS 类控制，多存一份状态迟早不同步。
    const pf = $("#preflight");
    if(pf && !pf.classList.contains("hidden") && typeof renderDebug === "function") renderDebug();
    const msgs = hist[world].filter(visible);
    if(!msgs.length){ renderEmpty(); paintStat(); return; }
    hist[world].forEach((m, i) => {
      if(visible(m)) chatEl.appendChild(m.sys ? buildSys(m) : buildMsg(m, i));
    });
    scrollDown();
    paintStat();
  }

  function renderEmpty(){
    const p = currentPersona();
    const prefix = (p && p.protocol && p.protocol.prefix) || "YUKI.N>";
    // 开场白不能像「重新建立连接」——你们本来就认识（CHAT-001）。
    // 这里只给一个在场的感觉，不宣布关系、不走开场剧情。
    const lines = world === "normal"
      ? ["在。", "有事就说。"]
      : ["……啊。", "我在这里。"];
    const div = document.createElement("div");
    div.className = "empty";
    div.innerHTML = lines.map(l =>
      `<div class="l"><span class="pre">${escapeHtml(prefix)}</span> ${escapeHtml(l)}</div>`).join("");

    const hint = document.createElement("div");
    hint.className = "hint";
    const readyBackend = backends.find(b => b.id === settings.backend) ||
                         backends.find(b => b.available);
    if(!settings.api_key && !settings.backend && !readyBackend){
      hint.textContent = "尚未配置接口 · 点这里填入 API Key";
      hint.classList.add("link");
      hint.onclick = openSettings;
    }else{
      hint.textContent = world === "normal"
        ? "SHE SPEAKS ONLY WHEN NECESSARY"
        : "THE OTHER LINE · 同一个她，另一条时间线";
    }
    div.appendChild(hint);

    if(corpusMeta){
      const c = document.createElement("div");
      c.className = "hint";
      // 语料不入库（版权原因）。没建索引时说清楚，不要显示「0 条」让人以为坏了。
      c.textContent = corpusMeta.lines
        ? `原作记录 ${corpusMeta.lines} 条 · ${corpusMeta.episodes.length} 个片源`
        : "没有原作记录 · 先放好 data/parsed 字幕并运行 py build_corpus.py";
      div.appendChild(c);
    }
    chatEl.appendChild(div);
  }

  function buildMsg(m, idx){
    const p = currentPersona();
    const prefix = (p && p.protocol && p.protocol.prefix) || "YUKI.N>";
    if(m.role === "user"){
      const wrap = document.createElement("div");
      wrap.className = "msg user";
      const t = document.createElement("div");
      t.className = "text";
      t.textContent = m.content;
      wrap.appendChild(t);
      return wrap;
    }
    const wrap = document.createElement("div");
    wrap.className = "msg yuki";
    wrap.innerHTML = `
      <div class="rail"></div>
      <div class="body">
        <div class="line"><span class="pre"></span><span class="txt"></span></div>
        <div class="meta">
          <span class="flag"></span>
          <button class="regen">重说</button>
        </div>
      </div>`;
    wrap.querySelector(".pre").textContent = prefix;
    const txtNode = wrap.querySelector(".txt");
    // 按块排版：图案块保空白不折行，文字块正常折行（见 artBlocks 的说明）。
    txtNode.classList.add("multi");
    renderBlocks(txtNode, m.content);
    applyMeta(wrap, m);
    wrap.querySelector(".regen").onclick = () => regenerate(idx);
    return wrap;
  }

  function buildSys(m){
    const d = document.createElement("div");
    d.className = "sys";
    (m.lines || []).forEach(([cls, txt]) => {
      const s = document.createElement("span");
      s.className = cls || "";
      s.textContent = txt;
      d.appendChild(s);
    });
    return d;
  }

  function systemLine(lines){
    hist[world].push({sys:true, lines});
    chatEl.querySelector(".empty")?.remove();
    chatEl.appendChild(buildSys({sys:true, lines}));
    scrollDown();
  }

  // CHAT-006：字数不进主聊天区。这里只留「这一条有没有问题」的提示，
  // 具体多少字去 ◇ 面板看。「重说」是操作，不是统计，留着。
  function applyMeta(node, m){
    const flag = node.querySelector(".flag");
    if(m.warn){
      flag.textContent = "△ " + m.warn;
      flag.className = "flag warn";
    }else{
      flag.textContent = "";
      flag.className = "flag";
    }
  }

  // CHAT-006：统计从主聊天区移到 ◇ 面板，底栏不再有 #stat。
  // 保留这个函数只是为了让散在各处的调用点不用改；它现在什么都不做，
  // 统计由 renderDebug() 现算。真正的「删掉」要连调用点一起清，
  // 但那会让每次重绘多绕一处，收益不大——留一个空函数比留一行假数据安全。
  function paintStat(){}

  function chatStats(w = world){
    const ai = hist[w].filter(m => m.role === "assistant" && (m.content || "").trim());
    const cn = t => (t || "").replace(/\s/g, "").length;
    const lens = ai.map(m => cn(m.content));
    const total = lens.reduce((a, b) => a + b, 0);
    const sentences = ai.map(m => (m.content.match(/[。！？!?]/g) || []).length || 1);
    const sTotal = sentences.reduce((a, b) => a + b, 0);
    return {
      replies: ai.length,
      total,
      avgReply: ai.length ? total / ai.length : 0,
      avgSentence: sTotal ? total / sTotal : 0,
      longest: lens.length ? Math.max(...lens) : 0,
      flagged: ai.filter(m => m.warn).length,
    };
  }

  function scrollDown(){ chatEl.scrollTop = chatEl.scrollHeight; }

  /* ================= 发送 ================= */
  function historyForApi(w = world){
    // 服务端统一保留最近 12 轮；这里排除协议消息和空占位。
    return hist[w]
      .filter(m => m.role === "user" || m.role === "assistant")
      .filter(m => m.content && m.content.trim())
      .map(m => ({role:m.role, content:m.content}));
  }

  function createTypewriter(txtEl, caret, persona){
    const configured = Number(persona?.protocol?.type_delay_ms ?? 42);
    const delay = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches
      ? 0 : (Number.isFinite(configured) ? Math.max(0, configured) : 42);
    let target = [], shown = 0, timer = null, finished = false, resolveDone;
    // 一旦判成图案，就**整块**显示：逐字吐出来的图案中途是一堆散字符，
    // 而且打字机的节奏是按「一句话」调的，图案不需要那个节奏。
    let artMode = false;
    const done = new Promise(resolve => { resolveDone = resolve; });
    function tick(){
      timer = null;
      if(artMode) shown = target.length;
      else shown = delay === 0 ? target.length : Math.min(shown + 1, target.length);
      paint(target.slice(0, shown).join(""));
      scrollDown();
      schedule();
    }
    function paint(content){
      renderBlocks(txtEl, content);
      txtEl.appendChild(caret);
    }
    function schedule(){
      if(shown < target.length && timer === null) timer = setTimeout(tick, delay);
      else if(finished && shown === target.length) resolveDone();
    }
    return {
      update(raw, final = false){
        // 模型误写的协议前缀可能跨 token 到达，确认前先不显示。
        const probe = raw.trimStart().replace(/\s/g, "").toUpperCase();
        const text = !final && probe && "YUKI.N>".startsWith(probe) ? "" : stripPrefix(raw);
        target = Array.from(text); // 不在 emoji 的 UTF-16 代理对中间断字。
        // 开头就看出像图案：不再逐字，直接给全（后面还有内容就继续整块给）。
        if(!artMode && (looksLikeArtPrefix(text) || isArt(text))){ artMode = true; shown = target.length; }
        // 图案模式下**立刻**铺上去，不等下一个 tick：等的话，流每来一块都要
        // 空一拍才补上，看起来像先空一块再补——比逐字更难看。
        if(artMode){
          if(timer !== null){ clearTimeout(timer); timer = null; }
          shown = target.length;
          paint(target.slice(0, shown).join(""));
          scrollDown();
          if(finished && shown === target.length) resolveDone();
          return;
        }
        schedule();
      },
      finish(){ finished = true; schedule(); return done; }
    };
  }

  async function send(){
    const text = inputEl.value.trim();
    if(!text || busy) return;
    // 只要能说话就发：自己的 Key，或任何一个可用后端。
    const anyBackend = backends.find(b => b.available);
    if(!settings.api_key && !settings.backend && !anyBackend){ openSettings(); return; }
    if(!settings.backend && !settings.api_key && anyBackend){ settings.backend = anyBackend.id; }

    const w = world;
    const requestHistory = historyForApi(w);
    const persona = currentPersona();
    busy = true; sendBtn.disabled = true;
    document.querySelectorAll("#tabs button").forEach(b => { b.disabled = true; });
    $("#clear").disabled = true;
    inputEl.value = ""; inputEl.style.height = "auto";

    chatEl.querySelector(".empty")?.remove();
    const userMsg = {role:"user", content:text};
    hist[w].push(userMsg);
    chatEl.appendChild(buildMsg(userMsg, hist[w].length - 1));

    const placeholder = {role:"assistant", content:"", chars:0, warn:""};
    hist[w].push(placeholder);
    const node = buildMsg(placeholder, hist[w].length - 1);
    const txtEl = node.querySelector(".txt");
    const caret = document.createElement("span");
    caret.className = "caret"; caret.textContent = "▍";
    txtEl.appendChild(caret);
    chatEl.appendChild(node);
    scrollDown();

    let acc = "";
    const typer = createTypewriter(txtEl, caret, persona);
    try{
      const useBackend = settings.backend || "";
      const payload = {
        world: w,
        message: text,
        history: requestHistory,
        temperature: parseFloat(settings.temperature) || 0.85,
        max_tokens: w === "normal" ? 220 : 320,
        k: 5
      };
      if(useBackend){
        // 可选后端：地址与 token 由服务端解析，前端只报 id 和模型名。
        payload.backend = useBackend;
        payload.model = settings.model || "";
      }else{
        payload.base_url = settings.base_url || "https://api.deepseek.com/v1";
        payload.api_key = settings.api_key;
        payload.model = settings.model || "deepseek-chat";
      }
      // 记下「真的发了什么」。必须在 fetch 之前抄一份，理由见 lastSent 注释。
      const sentSnapshot = {...payload};
      delete sentSnapshot.api_key;
      const resp = await fetch("/api/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      // 请求头里有上游回报的实际检索数与世界，服务端用它回答「这次到底注入了什么」。
      lastSent = {
        at: new Date().toISOString().slice(0, 19).replace("T", " "),
        payload: sentSnapshot,
        world: resp.headers && resp.headers.get ? resp.headers.get("X-Yuki-World") : "",
        hits: resp.headers && resp.headers.get ? Number(resp.headers.get("X-Yuki-Hits") || 0) : 0,
        status: resp.status,
      };

      if(!resp.ok){
        let msg = "请求失败";
        try{ msg = (await resp.json()).error || msg; }catch(e){}
        throw new Error(msg);
      }

      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      let completed = false, sawDone = false;
      let thinking = false;
      // 推理模型会先吐一大段 reasoning_content。它不进入正文，
      // 所以要给个可见提示，否则界面停在「0 字」看起来像卡死。
      function noteThinking(on){
        if(on === thinking) return;
        thinking = on;
        if(on && !acc){
          renderBlocks(txtEl, "（思考中）");
          txtEl.appendChild(caret);
        }else if(!on){
          renderBlocks(txtEl, Array.from(stripPrefix(acc)).join(""));
          txtEl.appendChild(caret);
        }
      }
      function consume(line){
        const s = line.trim();
        if(!s.startsWith("data:")) return;
        const d = s.slice(5).trim();
        if(d === "[DONE]"){ completed = true; sawDone = true; return; }
        let event;
        try{ event = JSON.parse(d); }catch(e){ return; }
        if(event.error) throw new Error(event.error.message || "上游流中断");
        const choice = event.choices?.[0];
        if(choice?.finish_reason) completed = true;
        if(choice?.delta?.reasoning_content) noteThinking(true);
        const piece = choice?.delta?.content;
        if(typeof piece === "string" && piece) noteThinking(false);
        if(typeof piece === "string" && piece){
          acc += piece;
          typer.update(acc);
        }
      }
      try{
        while(!sawDone){
          const {done, value} = await reader.read();
          buf += done ? dec.decode() : dec.decode(value, {stream:true});
          const lines = buf.split("\n");
          buf = lines.pop();
          for(const line of lines){ consume(line); if(sawDone) break; }
          if(done){ if(buf && !sawDone) consume(buf); break; }
        }
        if(!completed) throw new Error("流未完整结束");
      }finally{
        try{ await reader.cancel(); }catch(e){}
        reader.releaseLock();
      }

      // 不 trim：图案的行尾空白要留着（见 stripPrefix）。空内容才用省略号。
      placeholder.content = stripPrefix(acc) || "……";
      typer.update(placeholder.content, true);
      await typer.finish();
      renderBlocks(txtEl, placeholder.content);
      placeholder.warn = checkReply(placeholder.content);
      applyMeta(node, placeholder);

    }catch(err){
      placeholder.content = stripPrefix(acc) || "……连接失败。";
      typer.update(placeholder.content, true);
      await typer.finish();
      renderBlocks(txtEl, placeholder.content);
      placeholder.warn = acc.trim() ? "流中断" : String(err.message || err).slice(0, 60);
      applyMeta(node, placeholder);
    }finally{
      busy = false; sendBtn.disabled = false; inputEl.focus();
      document.querySelectorAll("#tabs button").forEach(b => { b.disabled = false; });
      $("#clear").disabled = false;
      paintStat();
      // 存档独立于请求成败，配额异常不能覆盖已经收到的回复。
      saveHist(w);
    }
  }

  // 去掉模型误写的「YUKI.N>」前缀。
  //
  // **不 trim**：原来这里是 `.trim()`，把首行缩进一起吃掉了。
  // 一行正文不需要缩进，看不出问题；但多行图案的左边距就是缩进，
  // 第一行被削平之后整块图案是歪的，而且歪得很隐蔽——只有第一行。
  // 只去掉前缀后面那一个分隔空格，其余空白原样保留（行尾空格也是排版的一部分）。
  function stripPrefix(t){
    let s = String(t);
    const m = s.match(/^[ \t\n]*YUKI\.N\s*>/i);
    if(m){
      s = s.slice(m[0].length);
      if(s[0] === " ") s = s.slice(1);
    }
    return s.replace(/\n+$/, "").replace(/^\n+/, "");
  }

  /* ================= 字符画（CHAT-017） ================= */
  // 判据与 textart.py 同源，两边各写一遍是 DEC-006 的要求：
  // 前端的检测器改一边、后端没改，测试会红。这里只做「这段回复是不是图案」
  // 和「对齐没对」，不做生成——生成方式还没定（PEND-006）。
  const ART_MAX_WIDTH = 40;
  const ART_SENTENCE = /[，。！？；：、…,.!?;:]/;
  // 右边缘差多少格才算不齐（与 Python 的 _ART_EDGE_GAP 一致）。
  const ART_EDGE_GAP = 3;
  // 「短图案行」的最大宽度（与 Python 的 _SHORT_ART_WIDTH 一致）。
  const SHORT_ART_WIDTH = 16;
  // 框线字符（与 Python 的 _FRAME_CHARS 一致）：出现在行首时各行必须上下对齐。
  // 自由形状的缩进不参与左边距判定——那是画法，不是错误。

        let k = j;

    const indents = [...new Set(body

      .filter(x => FRAME_CHARS.has(x.rest))
      .map(x => x.ind))].sort((a,b) => a-b);
    if(indents.length > 1) probs.push(`字符画各行左边距不一致（${indents.join("/")}），图案会歪`);
    const trailing = lines.findIndex(l => l !== l.replace(/ +$/, ""));

      for(const [kind, chunk] of artBlocks(text)){

  /* ================= 违例检测 ================= */
  // 括号动作的静态检查（CHAT-007）。必须与 scripts/check_persona.py
  // ::check_action_brackets 逐条等价 —— 两处实现是同一套规则的两次独立实现，
  // scripts/test_frontend.js 会逐例比对。改一边不改另一边，测试会红，
  // 而且红的原因会被误读成「新规则不对」。
  const SETTING_TERMS = [
    "数据链", "终端界面", "人形终端", "信息统合思念体", "思念体", "统合思念体",
    "信息流", "界面", "数据", "纳米机器", "重写", "权限", "情报",

  function bracketSpans(text){
    const content = []; let depth = 0, start = -1, bad = false;
    for(let i = 0; i < text.length; i++){
      const ch = text[i];
      if(ch === "（"){ if(depth) bad = true; depth++; start = i; }
      else if(ch === "）"){
        if(depth === 0){ bad = true; continue; }
        depth--;
        if(depth === 0) content.push(text.slice(start + 1, i));
      }
    }
    if(depth) bad = true;
    return {content, bad};
  }
  function checkBrackets(text){
    const errors = [];
    const opens = (text.match(/（/g) || []).length;
    const closes = (text.match(/）/g) || []).length;
    // 只把「像动作描写」的半角括号算错：前面是汉字、里面没有 ASCII 字母数字。
    // 「从 O(n) 降到 O(1)」这类代码、算式是正文，不能误伤。
    const re = /(?<![\u4e00-\u9fff])\(([^()]{1,30})\)?(?=[\s。，、…）]|$)/g;
    let m, asciiHit = null;
    while((m = re.exec(text)) !== null){
      if(/[\u4e00-\u9fff]/.test(m[1]) && !/[A-Za-z0-9]/.test(m[1])){ asciiHit = m[1]; break; }
    }
    if(asciiHit) errors.push("括号动作使用了半角 ( )，应统一为全角「（）」：（" + asciiHit + "）");
    if(opens !== closes) errors.push("括号不配对：左括号 " + opens + " 个，右括号 " + closes + " 个");
    const span = bracketSpans(text);
    if(span.bad && opens === closes) errors.push("括号嵌套或错位，检测器无法配对");
    for(const inner of span.content){
      const term = SETTING_TERMS.find(t => inner.includes(t));
      if(term){ errors.push("括号内含设定术语「" + term + "」——动作不能泄露设定（WORLD-001）"); break; }
    }
    return errors;
  }

  function checkReply(text){
    const p = currentPersona();
    if(!p) return "";
    const g = p.guard || {};
    const probs = [];
    (g.banned_patterns || []).forEach(pat => {
      try{
        const hit = text.match(new RegExp(pat, "i"));
        if(hit){
          const w = hit[0].replace(/[|()?]/g, "").slice(0, 8);
          if(!probs.includes("「" + w + "」")) probs.push("「" + w + "」");
        }
      }catch(e){}
    });
    // 分段（TERMINAL_PROMPT 第 1 条）。**例外**：字符画本来就是多行，
    // 还常常要空行分隔文字，那不是「分段」这个违例的意思（CHAT-017 / DEC-013）。
    //
    // 2026-10-26 修正：判据从「整条算不算图案」改成「有没有图案块」。
    // 实测反例：四句文字 + 空行 + 一张小图，整条不算图案（文字行占多数），
    // 于是那一个**用来引出图案的空行**被报成「分段」。规则说的是图案块
    // 可以用空行，不是「只有整条都是图案时才允许空行」。
    // 没有图案块的普通空行分段照旧要报（下面那条用例钉住）。
    if(/\n\s*\n/.test(text) && !hasArtBlock(text)) probs.push("分段");
    // 字符画的对齐问题：错在**画**上，不是语气。排在最后，和括号规则一样，
    // 不挤掉最常见的语气提示。
    if(isArt(text)) for(const e of checkArt(text)) if(!probs.includes(e)) probs.push(e);
    // 括号动作的问题排在最后：短提示先给最常见的（语气、服务话术），
    // 而且 slice(0,2) 只显示两条，不能把主规则挤掉。
    for(const e of checkBrackets(text)) if(!probs.includes(e)) probs.push(e);
    return probs.slice(0, 2).join(" ");
  }

  /* ================= 重说 ================= */
  async function regenerate(idx){
    if(busy) return;
    const w = world;
    const h = hist[w];
    // 找到这条回复前面最近的一条用户消息
    let ui = -1;
    for(let i = idx - 1; i >= 0; i--){ if(h[i].role === "user"){ ui = i; break; } }
    if(ui < 0) return;
    const text = h[ui].content;
    // 把「用户消息之后到这条回复」整段砍掉，把用户消息放回输入框再发一次
    hist[w] = h.slice(0, ui);
    inputEl.value = text;
    renderAll();
    await send();
  }

  /* ================= 世界切换 ================= */
  function switchWorld(w, opts = {}){
    if(busy) return;
    const wm = worlds && worlds[w];
    if(!wm) return;
    const prev = world;
    world = w;
    try{ localStorage.setItem(LS_WORLD, w); }catch(e){}
    document.querySelectorAll("#tabs button").forEach(b =>
      b.classList.toggle("on", b.dataset.w === w));
    loadHist(w);
    applyTheme();
    renderAll();

    if(prev !== w && !opts.silent){
      if(w === "crash"){
        systemLine([
          ["", "WORLD LINE ADJUSTING ……"],
          ["", "观测对象「凉宫春日」：未找到。"],
          ["", "SOS 团：未登记。"],
          ["ok", "重新建立连接。对面的人记得你。"],
        ]);
      }else{
        systemLine([
          ["", "RESTORING ……"],
          ["", "时空坐标校验：通过。"],
          ["", "观测对象「凉宫春日」：在线。"],
          ["ok", "通道重开。她在那头。"],
        ]);
      }
    }
  }

  /* ================= 设置 ================= */
  function renderBackendOptions(){
    const sel = $("#s-backend");
    if(!sel) return;
    sel.innerHTML = '<option value="">自定义接口（下面的 BASE URL / KEY）</option>';
    backends.forEach(b => {
      const o = document.createElement("option");
      o.value = b.id;
      o.textContent = b.available ? b.name : `${b.name}（不可用）`;
      o.disabled = !b.available;
      sel.appendChild(o);
    });
    sel.value = settings.backend || "";
    paintBackendNote();

  function paintBackendNote(){
    const note = $("#s-backend-note");
    if(!note) return;
    const b = backends.find(x => x.id === settings.backend);
    if(!b){ note.textContent = "用自己的 API Key。Key 只存在浏览器里。"; return; }
    note.textContent = b.available
      ? `${b.detail}`
      : `${b.name} 现在不可用：${b.reason || "未知原因"}`;
    paintModelPicker(b);
  }

  // 有后端时用下拉（datalist 在暗色主题下弹层是白底，而且只能按已输入内容过滤，
  // 等于没法选）；自填接口时才用文本框。
  function paintModelPicker(b){
    const sel = $("#s-model-select"), inp = $("#s-model"), hint = $("#s-model-note");
    if(!sel || !inp) return;
    const models = (b && b.models) || [];
    if(models.length){
      sel.innerHTML = "";
      models.forEach(m => {
        const o = document.createElement("option");
        o.value = m;
        o.textContent = m === b.recommended ? `${m}（推荐）` : m;
        sel.appendChild(o);
      });
      sel.value = models.includes(settings.model) ? settings.model : (b.recommended || models[0]);
      sel.classList.remove("hidden");
      inp.classList.add("hidden");
      if(hint) hint.textContent = b.recommended ? `推荐 ${b.recommended}：实测可用、回答稳定。` : "";
    }else{
      sel.classList.add("hidden");
      inp.classList.remove("hidden");
      inp.value = settings.model || "";
      if(hint) hint.textContent = "";
    }
  }

  function syncBackendVisibility(){
    const custom = $("#s-custom");
    if(custom) custom.style.display = settings.backend ? "none" : "";
    paintBackendNote();
  }

  async function loadBackends(){
    try{
      const r = await fetch("/api/backends");
      const d = await r.json();
      backends = d.backends || [];
    }catch(e){ backends = []; }
    // 没配过任何东西时，自动接上第一个可用后端 —— 让「打开就能说话」成立。
    // 用户显式选了自定义接口（backend 为空但填了 key）就不动他的设置。
    if(!settings.backend && !settings.api_key){
      const ready = backends.find(b => b.available);
      if(ready){
        settings.backend = ready.id;
        if(!settings.model){
          settings.model = ready.recommended || (ready.models || [])[0] || "";
        }
        saveSettings();
      }
    }
    // 后端报告的推荐模型变了就跟随（例如先前自动选中的 auto 是推理模型，
    // 会长时间停在 0 字）。只在用户没手动改过模型时跟随。
    if(settings.backend && !settings.modelTouched){
      const b = backends.find(x => x.id === settings.backend);
      if(b && b.recommended && settings.model !== b.recommended &&
         (!settings.model || b.models.includes(settings.model))){
        settings.model = b.recommended;
        saveSettings();
      }
    }    renderBackendOptions();
    syncBackendVisibility();
  }

  function openSettings(){
    $("#s-base").value = settings.base_url || "";
    $("#s-key").value = settings.api_key || "";
    $("#s-model").value = settings.model || "";
    $("#s-temp").value = settings.temperature || "0.85";
    renderBackendOptions();
    syncBackendVisibility();
    show("settings");
  }

  function renderCorpusList(){

    const body = $("#cx-body");

  async function openEpisode(ep, offset = 0){
    cxEp = {ep, offset};
    $("#cx-title").textContent = "资料终端 · " + ep;
    $("#cx-body").innerHTML = '<p class="note">读取中……</p>';
    try{
      const r = await fetch(`/api/corpus?ep=${encodeURIComponent(ep)}&offset=${offset}&limit=200`);
      const data = await r.json();
      cxCache = cxCache || {};
      renderEpisode(data);
    }catch(e){
      $("#cx-body").innerHTML = '<p class="note">读取失败。</p>';
    }
  }

  function renderEpisode(data){
    const body = $("#cx-body");
    body.innerHTML = "";
    const head = document.createElement("div");
    head.className = "cx-head";
    head.innerHTML = `<span class="back">← 片源</span>
      <span class="ttl"></span>
      <span class="rg"></span>`;
    head.querySelector(".ttl").textContent = `${data.title}`;
    head.querySelector(".rg").textContent = `${data.offset + 1}–${data.offset + data.items.length} / ${data.lines}`;
    head.querySelector(".back").onclick = () => { cxEp = null; renderCorpusList(); };
    body.appendChild(head);

    data.items.forEach(it => {
      const row = document.createElement("div");
      row.className = "cx-line" + (it.anchor > 0 ? " anchor" : "") + (it.world === "crash" ? " crash" : "");
      row.innerHTML = `<span class="ts"></span><span class="tx"></span>`;
      row.querySelector(".ts").textContent = it.start;
      row.querySelector(".tx").textContent = it.text;
      body.appendChild(row);
    });

    if(data.offset + data.items.length < data.lines){
      const more = document.createElement("div");
      more.className = "cx-more";
      more.textContent = "载入之后 200 条";
      more.onclick = () => openEpisode(data.ep, data.offset + data.items.length);
      body.appendChild(more);
    }
  }

  /* ================= 共同经历 ================= */
  // 记忆跟聊天记录一样**按世界分**：这里读写的都是 world 那份，切世界就换一套。
  // 服务端也强制按 world 过滤，前端只是不把两边的记录混在一起给人看。

  async function memCall(body){
    const r = await fetch("/api/memory", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({world, ...body})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "请求失败");
    return d;
  }

  async function openMemory(){
    show("memory");
    await paintMemory();
  }

  async function paintMemory(){
    const body = $("#mem-body");
    $("#mem-title").textContent = "共同经历 · " + (worlds && worlds[world] ? worlds[world].name : world);
    body.innerHTML = '<p class="note">读取中……</p>';
    let d;
    try{
      const r = await fetch(`/api/memory?world=${encodeURIComponent(world)}`);
      d = await r.json();
      if(!r.ok) throw new Error(d.error || "读取失败");
    }catch(e){
      // 读不出来要明说，不能显示成「还没有任何记录」——那会让人以为记忆丢了。
      body.innerHTML = `<p class="note">读不到记忆：${escapeHtml(e.message)}<br>主文件可能损坏，检查 data/memory/ 下的备份。</p>`;
      return;
    }
    body.innerHTML = "";
    if((d.warnings || []).length){
      const w = document.createElement("p");
      w.className = "note";
      w.textContent = d.warnings.join(" / ");
      body.appendChild(w);
    }

    const add = document.createElement("div");
    add.className = "mem-add";
    const inp = document.createElement("input");
    inp.placeholder = "记一件你们两个之间的事（只写这条，不用写「她应该……」）";
    inp.id = "mem-input";
    // 主体（R-07）：默认记「对方的事」，但也可以记她自己的事。
    // 不让人选的话，「她怕黑」和「你怕黑」会被记成一模一样的东西，
    // 她那边的提示词也就没法区分。
    const who = document.createElement("select");
    who.id = "mem-subject";
    who.innerHTML = '<option value="user">对方的事</option>' +
                    '<option value="yuki">她自己的事</option>' +
                    '<option value="together">你们一起</option>';
    const btn = document.createElement("button");
    btn.textContent = "记下";
    btn.onclick = async () => {
      const text = inp.value.trim();
      if(!text) return;
      btn.disabled = true;
      try{ await memCall({op:"add", text, subject: who.value || "user"}); await paintMemory(); }
      catch(e){ alert(e.message); btn.disabled = false; }
    };
    inp.addEventListener("keydown", e => { if(e.key === "Enter") btn.click(); });
    add.appendChild(who); add.appendChild(inp); add.appendChild(btn);
    body.appendChild(add);

    const active = d.records.filter(r => r.status === "active").slice().reverse();
    const retired = d.records.filter(r => r.status !== "active").slice().reverse();
    // 空状态说明必须用 appendChild 加，**不能**写 `body.innerHTML += …`：
    // innerHTML 赋值会把已有子节点全部重建，上面刚绑在输入框与「记下」按钮上的
    // onclick / keydown 会一起丢掉，于是空库里点「记下」毫无反应，
    // 第一条记忆永远存不进去（R-02，真实浏览器复现过）。
    if(!active.length){
      const empty = document.createElement("p");
      empty.className = "note";
      empty.textContent = "还没有记下任何事。她说的话不会凭空多出记忆。";
      body.appendChild(empty);
    }
    active.forEach(r => body.appendChild(memRow(r, false)));
    if(retired.length){
      const t = document.createElement("div");
      t.className = "mem-log";
      t.innerHTML = '<div class="t">回收站（被纠正或删掉的，不再出现在她的 prompt 里）</div>';
      body.appendChild(t);
      retired.forEach(r => body.appendChild(memRow(r, true)));
    }

    if((d.events || []).length){
      const log = document.createElement("div");
      log.className = "mem-log";
      log.innerHTML = '<div class="t">操作记录（最近 50 条）</div>';
      // 倒序：最近改的在上。日志是给人查「谁动了什么」用的。
      d.events.slice().reverse().forEach(e => {
        const row = document.createElement("div");
        row.className = "ev";
        const detail = e.op === "update" ? `「${e.from}」→「${e.to}」`
          : e.op === "restore" && (e.retired_followers || []).length ? "（同时退下了更新的那条）"
          : "";
        row.textContent = `${e.at}  ${e.op}  ${detail}`;
        log.appendChild(row);
      });
      body.appendChild(log);
    }
  }

  function memRow(r, retired){
    const row = document.createElement("div");
    row.className = "mem-rec" + (retired ? " retired" : "");
    const tx = document.createElement("div");
    tx.className = "tx";
    tx.textContent = r.text;
    row.appendChild(tx);

    const meta = document.createElement("div");
    meta.className = "row2";
    const mt = document.createElement("div");
    mt.className = "mt";
    const rev = r.revision > 1 ? ` · v${r.revision}` : "";
    const by = r.revises ? ' · <span class="tag">纠正了旧的一条</span>' : "";
    // 主体与来源（R-07）。不显示的话，「这是谁的事」「是不是我亲口说的」
    // 只能靠记忆文本自己去猜；而提示词那边已经按主体分别渲染了，
    // 界面不显示就等于让人无法核对模型看到的是什么。
    const SUBJ = {user: "对方的事", yuki: "她自己的事",
                  together: "你们一起", world: "这边的事"};
    const subj = SUBJ[r.subject] || "对方的事";
    const srcKind = (r.source && (r.source.kind || r.source)) || "";
    const SRC = {summary: "对话摘要", inferred: "推断", model: "对话摘要"};
    const src = SRC[String(srcKind).toLowerCase()]
      ? ` · <span class="tag warn">${escapeHtml(SRC[String(srcKind).toLowerCase()])}</span>` : "";
    mt.innerHTML = `${escapeHtml((r.created || "").replace("T", " "))}${rev}` +
      ` · <span class="tag">${escapeHtml(subj)}</span>${src}${by}`;
    meta.appendChild(mt);

    const ops = document.createElement("div");
    ops.className = "ops";
    const mk = (label, title, fn) => {
      const s = document.createElement("span");
      s.textContent = label; s.title = title;
      s.onclick = fn;
      return s;
    };
    if(retired){
      ops.appendChild(mk("恢复", "恢复这条；若它已被更新的一条取代，那条会退下", async () => {
        await act(() => memCall({op:"restore", id:r.id}));
      }));
    }else{
      ops.appendChild(mk("改", "改写这条的措辞（同一个事实）", async () => {
        const v = prompt("改成：", r.text);
        if(v === null || !v.trim()) return;
        await act(() => memCall({op:"update", id:r.id, text:v}));
      }));
      // 「纠正成新事实」和「改措辞」是两件事：前者要留旧的做历史，
      // 后者只是同一句写错了。所以纠正走 add(revises)，旧版自动进回收站。
      ops.appendChild(mk("换成新说法", "记一条新的取代它，旧的进回收站", async () => {
        const v = prompt("现在的说法是：", "");
        if(v === null || !v.trim()) return;
        await act(() => memCall({op:"add", text:v, subject:r.subject || "user", revises:r.id}));
      }));
      ops.appendChild(mk("删", "从她的记忆里去掉（进回收站，可恢复）", async () => {
        await act(() => memCall({op:"delete", id:r.id}));
      }));
    }
    meta.appendChild(ops);
    row.appendChild(meta);
    return row;
  }

  async function act(fn){
    try{ await fn(); }
    catch(e){ alert(e.message); }
    await paintMemory();
  }

  /* ================= 调试面板 ================= */
  // V-UI-02：两块必须分开写清楚——「上一次实际发送」和「下一次预览」回答的是
  // 不同问题。改过输入框之后，预览里是改后的文本，而上一轮发出去的是改前的；
  // 混成一块会让人以为「刚才发的是这个」。
  async function openPreflight(){
    show("preflight");
    renderDebug();
  }

  function renderDebug(){
    const body = $("#pf-body");
    body.innerHTML = "";
    const w = worlds && worlds[world] ? worlds[world].name : world;
    const s = chatStats();

    const stats = document.createElement("div");
    stats.className = "dbg-stats";
    stats.innerHTML = s.replies
      ? `世界 <b>${escapeHtml(w)}</b><span>回复 <b>${s.replies}</b> 条</span>
         <span>共 <b>${s.total}</b> 字</span><span>平均 <b>${s.avgReply.toFixed(1)}</b> 字/条</span>
         <span>平均 <b>${s.avgSentence.toFixed(1)}</b> 字/句</span><span>最长 <b>${s.longest}</b> 字</span>
         <span>标了 △ 的 <b>${s.flagged}</b> 条</span>`
      : `世界 <b>${escapeHtml(w)}</b><span>还没有回复。</span>`;
    body.appendChild(stats);

    body.appendChild(dbgActual());
    body.appendChild(dbgViolations());
    body.appendChild(dbgPreview());
  }

  // 上一轮实际发送。和预览的区别是它有确定的 payload 快照。
  function dbgActual(){
    const box = document.createElement("div");
    const sec = document.createElement("div");
    sec.className = "dbg-sec";
    sec.textContent = "上一次实际发送";
    box.appendChild(sec);
    if(!lastSent){
      const p = document.createElement("p");
      p.className = "note";
      p.textContent = "这次会话还没有发出过请求。下面只有「下一次预览」。";
      box.appendChild(p);
      return box;
    }
    const p = lastSent.payload;
    const head = document.createElement("div");
    head.className = "note";
    head.innerHTML = `${escapeHtml(lastSent.at)} · 世界 ${escapeHtml(p.world)} ·
      模型 ${escapeHtml(p.model || "（未指定）")} · 温度 ${escapeHtml(String(p.temperature))} ·
      上限 ${escapeHtml(String(p.max_tokens))} token ·
      历史 ${escapeHtml(String((p.history || []).length))} 条 ·
      请求检索 ${escapeHtml(String(p.k))} 条，服务端回报命中 ${escapeHtml(String(lastSent.hits))} 条 ·
      HTTP ${escapeHtml(String(lastSent.status))}`;
    box.appendChild(head);

    const q = document.createElement("div");
    q.className = "dbg-msg";
    q.innerHTML = '<div class="who">当时发出去的这句话</div>' +
      `<div class="bod">${escapeHtml(p.message || "")}</div>`;
    box.appendChild(q);

    const segs = (p.history || []).slice(-6);
    if(segs.length){
      const his = document.createElement("div");
      his.className = "dbg-msg";
      his.innerHTML = '<div class="who">随请求带上的最近历史（旧 → 新，最多显示 6 条）</div>' +
        segs.map(m => `<div class="bod">${m.role === "user" ? "你" : "她"}：${escapeHtml(m.content)}</div>`).join("");
      box.appendChild(his);
    }
    return box;
  }

  // 逐条校对信息（CHAT-006 要移进来的东西）：哪几条被标了 △、为什么。
  function dbgViolations(){
    const box = document.createElement("div");
    const sec = document.createElement("div");
    sec.className = "dbg-sec";
    sec.textContent = "违例与告警";
    box.appendChild(sec);
    const flagged = hist[world].filter(m => m.role === "assistant" && m.warn);
    if(!flagged.length){
      const p = document.createElement("p");
      p.className = "note";
      p.textContent = "这一轮没有违例，也没有流中断。";
      box.appendChild(p);
      return box;
    }
    flagged.forEach(m => {
      const d = document.createElement("div");
      d.className = "dbg-msg";
      d.innerHTML = `<div class="who dbg-wing">△ ${escapeHtml(m.warn)}</div>` +
        `<div class="bod">${escapeHtml((m.content || "").slice(0, 120))}</div>`;
      box.appendChild(d);
    });
    return box;
  }

  // 下一次预览：拿当前输入框的内容重新组装。这一块不调用模型、不花钱。
  function dbgPreview(){
    const box = document.createElement("div");
    const sec = document.createElement("div");
    sec.className = "dbg-sec";
    sec.textContent = "下一次预览（用当前输入框的内容重新组装，不调用模型）";
    box.appendChild(sec);

    const text = inputEl.value.trim();
    if(!text){
      const p = document.createElement("p");
      p.className = "note";
      p.textContent = "输入框是空的。写一句话再回来看这一块。";
      box.appendChild(p);
      return box;
    }
    const tip = document.createElement("p");
    tip.className = "note";
    tip.textContent = "注意：这是「如果现在发」的样子，不是上面那次实际发送的内容。";
    box.appendChild(tip);

    const holder = document.createElement("div");
    holder.textContent = "正在组装……";
    holder.className = "note";
    box.appendChild(holder);

    fetch("/api/preview", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({world, message:text, history:historyForApi()})
    }).then(r => r.json().then(d => ({ok:r.ok, d}))).then(({ok, d}) => {
      if(!ok){
        holder.textContent = d.error || "组装失败";
        return;
      }
      holder.remove();
      const pre = document.createElement("pre");
      pre.className = "prompt";
      pre.textContent = d.system_prompt;
      box.appendChild(pre);

      const hits = document.createElement("div");
      hits.className = "hits";
      // 共同经历这里分三个数，别合成一个「N 条」（T3，2026-10-26）：
      // 检索到 N 条 / 实际进上下文 M 条 / 其中 K 条被截断。
      // 合成一个数时，「存了 6 条却一条都没进上下文」和「没存过记忆」长得一样，
      // 用户只会以为她记不住——真正的原因在渲染层，不在模型。
      const mr = d.memory_render || {};
      const memLine = `共同经历：检索到 ${d.memory_count || 0} 条，进上下文 ` +
        `${mr.listed || 0} 条` +
        ((mr.truncated || 0) > 0 ? `（${mr.truncated} 条超长已截断）` : "") +
        ((mr.skipped || 0) > 0 ? `（${mr.skipped} 条因字符预算跳过）` : "");
      hits.innerHTML = `<div class="t">会注入的原作记录（${d.hits.length} 条 · ` +
        `${escapeHtml(memLine)} · 共 ${d.message_count} 条消息）</div>`;
      d.hits.forEach((h, i) => {
        const d2 = document.createElement("div");
        d2.className = "hit";
        d2.innerHTML = `<b>${i + 1}</b> ` +
          `<span class="${h.world === world ? "" : "cr"}">${h.world === world ? "" : "〔另一世界〕"}</span> ` +
          `${escapeHtml(h.ep_title)} ${escapeHtml(h.start)} · ${h.score}<br>${escapeHtml(h.text)}`;
        hits.appendChild(d2);
      });
      if(!d.hits.length){
        // 同 R-02：`innerHTML +=` 会重建 hits 下的子节点。这里眼下没有绑定
        // 事件，但同一个坑已经害过一次，不要留第二种写法。
        const none = document.createElement("div");
        none.className = "hit";
        none.textContent = "没有命中。她会凭人格回答，不会有原作依据。";
        hits.appendChild(none);
      }
      box.appendChild(hits);

      // 场景状态（CHAT-013）：她这侧「此刻」记着什么。
      // 摆在预览末尾而不是最前，是因为它是附带信息；但必须能看见——
      // 状态错了（比如用户说「我摘了眼镜」却改了她的设定）只能靠这里发现。
      //
      // 用「戴着眼镜 / 没有戴眼镜」这类**完整说法**，不写「眼镜：是/否」：
      // 「眼镜：否」看一眼分不清是「缺眼镜」还是「没戴眼镜」，这种含糊在核对
      // 状态时会直接导致误判——而这块存在的唯一理由就是核对。
      const sc = document.createElement("div");
      sc.className = "hits";
      const LABEL = {
        glasses: {true: "戴着眼镜", false: "没有戴眼镜"},
        book: {true: "手里那本书是打开的", false: "书是合上的"},
        together: {true: "你们在同一个空间", false: "隔着终端，不在同一空间"},
      };
      const ORDER = ["glasses", "book", "together"];
      const known = d.scene_state || {};
      const rows = ORDER
        .filter(k => k in known && known[k] !== null && known[k] !== undefined)
        .map(k => LABEL[k][known[k] === true]);
      sc.innerHTML = `<div class="t">此刻记录的状态（${rows.length} 项）</div>` +
        (rows.length
          ? `<div class="hit">${rows.join(" · ")}</div>`
          : '<div class="hit">没有任何记录。她不会替这些编一个。</div>');
      box.appendChild(sc);
    }).catch(() => { holder.textContent = "组装失败。"; });
    return box;
  }

  /* ================= 事件 ================= */
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + "px";
  });
  inputEl.addEventListener("keydown", e => {
    if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
  });
  sendBtn.onclick = send;

  $("#open-settings").onclick = openSettings;
  $("#open-corpus").onclick = openCorpus;
  $("#open-memory").onclick = openMemory;
  $("#open-preflight").onclick = openPreflight;

  document.querySelectorAll("[data-close]").forEach(b => {
    b.onclick = () => hide(b.dataset.close);
  });
  document.querySelectorAll(".mask").forEach(m => {
    m.addEventListener("click", e => { if(e.target === m) hide(m.id); });
  });

  $("#save-settings").onclick = () => {
    settings.backend = $("#s-backend") ? $("#s-backend").value : "";
    settings.base_url = $("#s-base").value.trim();
    settings.api_key = $("#s-key").value.trim();
    // 有下拉就读下拉，否则读文本框。
    const selEl = $("#s-model-select");
    const useSelect = selEl && !selEl.classList.contains("hidden") && selEl.value;
    const typedModel = useSelect ? selEl.value : $("#s-model").value.trim();
    if(typedModel && typedModel !== settings.model) settings.modelTouched = true;
    settings.model = typedModel;
    settings.temperature = $("#s-temp").value.trim() || "0.85";
    saveSettings();
    syncBackendVisibility();
    hide("settings");
  };

  if($("#s-backend")){
    $("#s-backend").onchange = () => {
      settings.backend = $("#s-backend").value;
      // 切到可选后端时，模型名留空表示「用该后端默认模型」。
      const b = backends.find(x => x.id === settings.backend);
      if(b){
        $("#s-model").value = settings.model && (b.models || []).includes(settings.model)
          ? settings.model : ((b.models || [])[0] || "");
      }
      syncBackendVisibility();
    };
  }

  $("#clear").onclick = () => {
    if(busy) return;
    if(!confirm("断开这次连接？当前世界的记录会被清掉（另一个世界不受影响）。")) return;
    hist[world] = [];
    try{ localStorage.removeItem(LS_HIST(world)); }catch(e){}
    renderAll();
  };

  document.querySelectorAll("#presets button").forEach(b => {
    b.onclick = () => {
      $("#s-base").value = b.dataset.b;
      $("#s-model").value = b.dataset.m;
      $("#s-key").focus();
    };
  });
  $("#model-tag").onclick = openSettings;
  $("#model-tag").style.cursor = "pointer";

  window.addEventListener("keydown", e => {
    if(e.key === "Escape") hideAll();
  });

  /* ================= 启动 ================= */
  (async () => {
    loadSettings();
    try{
      const [pw, ww] = await Promise.all([
        fetch("/api/personas").then(r => r.json()),
        fetch("/api/worlds").then(r => r.json())
      ]);
      pw.forEach(p => { personas[p.id] = p; });
      worlds = ww.worlds;
      corpusMeta = ww.corpus;
      await loadBackends();
    }catch(e){
      chatEl.innerHTML = '<div class="empty"><div class="l">连不上本地服务。</div>' +
        '<div class="l">先运行 python server.py</div></div>';
      return;
    }

    // 世界切换按钮
    const tabs = $("#tabs");
    for(const [id, meta] of Object.entries(worlds)){
      const b = document.createElement("button");
      b.dataset.w = id;
      b.innerHTML = `<span>${escapeHtml(meta.name)}</span><span class="en">${escapeHtml(meta.en)}</span>`;
      b.onclick = () => switchWorld(id);
      tabs.appendChild(b);
    }

    let saved;
    try{ saved = localStorage.getItem(LS_WORLD); }catch(e){}
    switchWorld(worlds[saved] ? saved : "normal", {silent:true});
  })();

  /* ================= 工具 ================= */
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
})();
</script>
</body>
</html>
